plugins {
    id 'java-library'
    id 'antlr'
    id 'maven-publish'
}

// Translanguage is a library-only project: other programs embed it as a dependency.
// It deliberately has no application plugin, main class, run task, or distribution.
group = 'com.pingsu'
version = '2.0.1'
description = 'TypeScript to JavaScript transpiler library (library only; no CLI or standalone tool).'

repositories { mavenCentral() }

sourceSets {
    // The reference backend has independent packages and cannot shadow production classes.
    reference { }
}
configurations.testImplementation.extendsFrom(configurations.referenceImplementation)

dependencies {
    referenceImplementation 'org.antlr:antlr4-runtime:4.13.2'
    referenceImplementation 'com.google.javascript:closure-compiler:v20240317'
    testImplementation sourceSets.reference.output
    antlr 'org.antlr:antlr4:4.13.2'
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Independent JavaScript parser: assert the actual ES grammar of emitted artifacts.
    testRuntimeOnly 'org.webjars.npm:acorn:8.15.0'
}

// Gradle's ANTLR plugin adds the generator to api by default.
// The generator and its runtime are confined to the reference source set.
configurations.api {
    setExtendsFrom(extendsFrom.findAll { it.name != 'antlr' })
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    // Identical release bytecode under both build JVMs; tests still run on the selected build JDK.
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(Javadoc).configureEach {
    javadocTool = javaToolchains.javadocToolFor { languageVersion = JavaLanguageVersion.of(17) }
    options.encoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:all,-missing', true)
    // Document the public API; parser implementation classes remain internal.
    include 'com/pingsu/transpiler/**'
    exclude 'com/pingsu/transpiler/internal/**'
}

// examples/ is sample input for library consumers and is also used by ExampleTest.
sourceSets.test.resources.srcDir 'examples'

test {
    useJUnitPlatform()
    systemProperty 'translanguage.evidence.dir', layout.buildDirectory.dir('compilation-evidence').get().asFile.absolutePath
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes(
                'Automatic-Module-Name': 'com.pingsu.transpiler',
                'Implementation-Title': 'Translanguage',
                'Implementation-Version': project.version)
    }
}

tasks.named('jar') {
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
}

publishing {
    publications {
        library(MavenPublication) {
            from components.java
            pom {
                name = 'Translanguage'
                description = project.description
            }
        }
    }
    repositories {
        maven {
            name = 'buildRepo'
            url = layout.buildDirectory.dir('repo')
        }
    }
}

apply from: 'gradle/consumer-verification.gradle'

tasks.named('generateReferenceGrammarSource') {
    inputs.property('lexerVocabulary', providers.fileContents(
            layout.projectDirectory.file('src/reference/antlr/TypeScriptLexer.g4')).asText)
    arguments += ['-visitor', '-no-listener']
    packageName = 'com.pingsu.reference.antlr'
    maxHeapSize = '256m'
}
tasks.named('processTestResources') {
    from('docs/baseline/2026-11-01/compilation-evidence.zip') { into 'baseline' }
}

apply from: 'gradle/release-verification.gradle'
